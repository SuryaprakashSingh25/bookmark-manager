<app-bookmark-form (bookmarkCreated)="loadBookmarks()"></app-bookmark-form>

<div class="bookmark-grid">
  <div class="bookmark-card" *ngFor="let bookmark of bookmarks">

    <h3>
      {{ bookmark.title || 'No Title' }}
    </h3>

    <p>
      {{ bookmark.description }}
    </p>

    <a [href]="bookmark.url" target="_blank">
      Visit Site
    </a>

    <button class="delete-btn" (click)="deleteBookmark(bookmark.id)">
      Delete
    </button>

  </div>
</div>
