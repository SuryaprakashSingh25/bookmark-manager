<div class="auth-page">
  <div class="auth-card">
    <h2>Reset Password</h2>

    <div *ngIf="isInvalidToken" class="error-message">
      <p>Invalid or expired reset link.</p>
      <button (click)="goToLogin()" class="auth-card button">Back to Login</button>
    </div>

    <div *ngIf="!isInvalidToken" class="form-group">
      <form (ngSubmit)="onSubmit()">
        <div>
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="Enter new password"
            required
            class="auth-card input-field"
          />
        </div>

        <div>
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm new password"
            required
            class="auth-card input-field"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading"
          class="auth-card button"
        >
          {{ isLoading ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>

      <div class="auth-links">
        <a (click)="goToLogin()" class="link">Back to Login</a>
      </div>
    </div>
  </div>
</div>
