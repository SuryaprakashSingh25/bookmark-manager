<div class="auth-page">
  <div class="auth-card">
    <h2>Forgot Password</h2>

    <div *ngIf="!isSubmitted" class="form-group">
      <p class="help-text">Enter your email address and we'll send you a link to reset your password.</p>

      <form (ngSubmit)="onSubmit()">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          required
          class="auth-card input-field"
        />

        <button
          type="submit"
          [disabled]="isLoading"
          class="auth-card button"
        >
          {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/login" class="link">Back to Login</a>
      </div>
    </div>

    <div *ngIf="isSubmitted" class="success-message">
      <p>Check your email for password reset instructions.</p>
      <p>The reset link will expire in 24 hours.</p>
      <div class="auth-links">
        <a (click)="goToLogin()" class="link">Back to Login</a>
      </div>
    </div>
  </div>
</div>
