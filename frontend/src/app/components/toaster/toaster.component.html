<div class="toast-container" *ngIf="(toaster.toasts$ | async)?.length">
  <div class="toast-item" *ngFor="let toast of toaster.toasts$ | async" [ngClass]="toast.type">
    <div class="toast-message">{{ toast.message }}</div>
    <button type="button" class="toast-close" (click)="toaster.dismiss(toast.id)">×</button>
  </div>
</div>
